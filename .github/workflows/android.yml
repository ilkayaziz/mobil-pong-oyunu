name: Android Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Build with Buildozer
      uses: kivy/buildozer-action@v0.2.2
      with:
        filename: gelismisOyun.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: paketlenen-apk
        path: bin/*.apk
